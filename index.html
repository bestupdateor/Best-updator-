<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEST UPDATOR</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .8;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      text-align: center;
    }

    .product img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 18px;
      margin-bottom: 12px;
    }

    .product h3 {
      margin: 8px 0;
    }

    .product p {
      color: #6b7280;
      min-height: 40px;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin: 12px 0;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .add {
      background: #111827;
      color: white;
      width: 100%;
    }

    #cart {
      display: none;
      background: white;
      margin-top: 30px;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      margin-top: 18px;
    }

    .payment {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 18px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .checkout {
      background: #16a34a;
      color: white;
      width: 100%;
      margin-top: 15px;
      font-size: 16px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <h1 id="shopName">BEST UPDATOR</h1>
  <p>Your trusted online shop</p>
</header>

<div class="container">

  <h2>Available Products</h2>

  <div id="products" class="products">
    <div class="empty">Loading products...</div>
  </div>

  <div id="cart">
    <h2>Your Cart</h2>

    <div id="cartItems"></div>

    <div class="total">
      Total: ₦<span id="cartTotal">0</span>
    </div>

    <div class="payment
